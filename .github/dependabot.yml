# =============================================================================
# Dependabot Configuration
# =============================================================================
# Automated dependency updates for GitHub Actions.
# =============================================================================

version: 2

updates:

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "13:30"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(actions)"
    labels:
      - "dependencies"
      - "github-actions"
